    <link rel="stylesheet" href="../Styles/general.css" />
    <link rel="stylesheet" href="../Styles/contact.css" />
    <link rel="stylesheet" href="../Styles/loader.css" />
    <script src="../Javascript/loader.js"></script>
    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="loader">
      <div class="spinner">
        <img
          src="https://static.vecteezy.com/system/resources/previews/036/646/696/non_2x/gun-free-vector.png"
          alt="Loading Icon"
        />
      </div>
    </div>

    <div class="nav">
      <h1 class="gun">G.U.N</h1>
      <h1>Gunners</h1>
      <div class="navright">
        <a href="../index.html">Home</a>
        <a href="../Pages/about.html">About</a>
        <a href="../Pages/contact.html">Contact</a>
        <a href="../Pages/pricing.html">Pricing</a>
        <a href="../Pages/availability.html">Availability</a>
      </div>
    </div>
    <main class="contact">
      <h2>Contact Us</h2>
      <p>
        Have questions or want to schedule a service? Reach out to us using the
        form below, and our team will get back to you as soon as possible.
      </p>
      <form class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
  </body>
</html>
